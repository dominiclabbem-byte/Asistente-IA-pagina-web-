<!-- ============================================================
     BestFood Chile - Asistente IA
     Pegar justo antes de </body> en la configuración de Hostinger
     ============================================================ -->
<style>
#bf-btn{position:fixed;bottom:24px;right:24px;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#e8231a,#9b1a13);border:none;cursor:pointer;box-shadow:0 4px 22px rgba(232,35,26,.45);display:flex;align-items:center;justify-content:center;z-index:9998;transition:transform .2s}
#bf-btn:hover{transform:scale(1.09)}
#bf-btn svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2}
#bf-dot{position:absolute;top:0;right:0;width:18px;height:18px;background:#fff;border-radius:50%;border:2px solid #e8231a;color:#e8231a;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
#bf-box{position:fixed;bottom:100px;right:24px;width:360px;height:560px;max-height:calc(100vh - 130px);background:#fff;border-radius:20px;box-shadow:0 14px 50px rgba(0,0,0,.17);display:none;flex-direction:column;z-index:9999;overflow:hidden;animation:bfIn .22s ease}
#bf-box.on{display:flex}
@keyframes bfIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.bfh{background:linear-gradient(135deg,#e8231a,#9b1a13);padding:15px 18px;display:flex;align-items:center;gap:11px;flex-shrink:0}
.bfav{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px}
.bfhi h3{color:#fff;font-size:15px;font-weight:600;margin:0}
.bfhi p{color:rgba(255,255,255,.82);font-size:12px;margin:0}
.bfol{display:inline-block;width:7px;height:7px;background:#4ade80;border-radius:50%;margin-right:4px}
.bfcl{margin-left:auto;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:.8;line-height:1;padding:2px 6px}
.bfcl:hover{opacity:1}
#bf-msgs{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth}
#bf-msgs::-webkit-scrollbar{width:4px}
#bf-msgs::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
.bfm{max-width:83%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.52;word-wrap:break-word;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.bfm.bot{background:#f1f5f9;color:#1e293b;align-self:flex-start;border-bottom-left-radius:3px}
.bfm.usr{background:linear-gradient(135deg,#e8231a,#9b1a13);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.bftyp{display:flex;align-items:center;gap:4px;padding:10px 13px;background:#f1f5f9;border-radius:16px;border-bottom-left-radius:3px;align-self:flex-start}
.bftyp span{width:7px;height:7px;background:#94a3b8;border-radius:50%;animation:bfbounce 1.1s infinite}
.bftyp span:nth-child(2){animation-delay:.18s}
.bftyp span:nth-child(3){animation-delay:.36s}
@keyframes bfbounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
#bf-chips{padding:8px 11px;display:flex;flex-wrap:wrap;gap:5px;border-top:1px solid #f1f5f9;flex-shrink:0}
.bfchip{background:#fff;border:1px solid #e2e8f0;color:#e8231a;font-size:12px;padding:5px 10px;border-radius:20px;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit}
.bfchip:hover{background:#e8231a;color:#fff;border-color:#e8231a}
#bf-form{padding:11px 13px;border-top:1px solid #f1f5f9;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
#bf-inp{flex:1;border:1.5px solid #e2e8f0;border-radius:11px;padding:9px 13px;font-size:14px;resize:none;outline:none;max-height:90px;overflow-y:auto;transition:border-color .2s;font-family:inherit}
#bf-inp:focus{border-color:#e8231a}
#bf-snd{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#e8231a,#9b1a13);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s}
#bf-snd:disabled{opacity:.45;cursor:not-allowed}
#bf-snd svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2}
.bfft{text-align:center;font-size:10px;color:#cbd5e1;padding:5px;flex-shrink:0;font-family:inherit}
@media(max-width:400px){#bf-box{width:calc(100vw - 14px);right:7px}#bf-btn{right:12px;bottom:12px}}
</style>

<button id="bf-btn" title="Habla con nosotros">
  <div id="bf-dot">1</div>
  <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>

<div id="bf-box">
  <div class="bfh">
    <div class="bfav">🍖</div>
    <div class="bfhi"><h3>BestFood Asistente</h3><p><span class="bfol"></span>En línea ahora</p></div>
    <button class="bfcl" id="bf-cl">&times;</button>
  </div>
  <div id="bf-msgs"></div>
  <div id="bf-chips">
    <button class="bfchip" data-q="¿Qué productos venden?">¿Qué productos tienen?</button>
    <button class="bfchip" data-q="¿Hacen despacho a domicilio?">¿Despacho a domicilio?</button>
    <button class="bfchip" data-q="Quiero solicitar una cotización">Pedir cotización</button>
    <button class="bfchip" data-q="¿Cuál es el precio?">Precios</button>
  </div>
  <div id="bf-form">
    <textarea id="bf-inp" placeholder="Escribe tu pregunta..." rows="1"></textarea>
    <button id="bf-snd" disabled>
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="bfft">Asistente IA · BestFood Chile</div>
</div>

<script>
(function(){
  var KEY   = 'TU_API_KEY_AQUI'; // ← Reemplaza con tu API Key de Anthropic
  var MODEL = 'claude-haiku-4-5-20251001'; // modelo rápido y económico
  var SYS   = 'Eres el asistente virtual de BestFood Chile, empresa chilena especializada en distribución y venta de alimentos premium para restaurantes, hoteles, casinos, empresas de catering y hogares.\n\nPRODUCTOS: carnes premium nacionales e importadas, mariscos frescos y congelados, frutas y verduras seleccionadas, lácteos, productos gourmet importados, congelados de calidad.\n\nSERVICIOS: despacho a domicilio y a local comercial, pedidos programados (semanal/mensual), asesoría en selección de productos, precios por volumen para empresas, facturación para empresas.\n\nCONTACTO: ventas@bestfoodchile.cl | +56 9 XXXX XXXX\nHORARIO: Lunes a Viernes 8:00–18:00, Sábado 9:00–13:00\nCOBERTURA: Santiago y regiones (confirmar disponibilidad)\nPAGO: transferencia, tarjeta crédito/débito, factura para empresas\n\nOBJETIVO: responder dudas, mostrar el valor de BestFood y capturar datos del lead (nombre, teléfono o email) cuando haya interés de compra. Cuando captures datos, agradece y dile que un ejecutivo lo contactará pronto.\n\nTONO: amable, cercano, profesional, español chileno natural. Respuestas cortas (máx 3–4 oraciones). Si no sabes el precio exacto, ofrece conectar al visitante con el equipo de ventas. Nunca inventes información.';

  var btn   = document.getElementById('bf-btn');
  var box   = document.getElementById('bf-box');
  var cl    = document.getElementById('bf-cl');
  var msgs  = document.getElementById('bf-msgs');
  var inp   = document.getElementById('bf-inp');
  var snd   = document.getElementById('bf-snd');
  var dot   = document.getElementById('bf-dot');
  var chips = document.getElementById('bf-chips');

  var hist=[], open=false, busy=false, started=false;

  btn.onclick = function(){
    open=!open;
    box.classList.toggle('on',open);
    dot.style.display='none';
    if(open&&!started){started=true;addMsg('bot','¡Hola! Bienvenido/a a BestFood Chile 👋 Soy tu asistente virtual. ¿En qué puedo ayudarte hoy? Puedo contarte sobre nuestros productos, precios, despachos o conectarte con el equipo de ventas.');}
    if(open) inp.focus();
  };
  cl.onclick = function(){open=false;box.classList.remove('on');};

  chips.querySelectorAll('.bfchip').forEach(function(c){
    c.onclick=function(){go(c.dataset.q);chips.style.display='none';};
  });

  inp.oninput=function(){
    snd.disabled=!inp.value.trim();
    inp.style.height='auto';
    inp.style.height=Math.min(inp.scrollHeight,90)+'px';
  };
  inp.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();trigger();}};
  snd.onclick=trigger;

  function trigger(){var t=inp.value.trim();if(!t||busy)return;go(t);inp.value='';inp.style.height='auto';snd.disabled=true;}

  function addMsg(r,t){
    var d=document.createElement('div');
    d.className='bfm '+r;
    d.textContent=t;
    msgs.appendChild(d);
    msgs.scrollTop=msgs.scrollHeight;
  }
  function showTyp(){var d=document.createElement('div');d.className='bftyp';d.id='bft';d.innerHTML='<span></span><span></span><span></span>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
  function hideTyp(){var d=document.getElementById('bft');if(d)d.remove();}

  function go(text){
    if(busy)return;
    addMsg('usr',text);
    hist.push({role:'user',content:text});
    busy=true;snd.disabled=true;showTyp();
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:MODEL,
        max_tokens:400,
        system:SYS,
        messages:hist.slice(-16)
      })
    })
    .then(function(r){return r.json();})
    .then(function(d){
      hideTyp();
      var reply=(d.content&&d.content[0]&&d.content[0].text)||'Hubo un problema. Escríbenos a ventas@bestfoodchile.cl';
      addMsg('bot',reply);
      hist.push({role:'assistant',content:reply});
    })
    .catch(function(){
      hideTyp();
      addMsg('bot','Tuve un problema al conectarme. Escríbenos a ventas@bestfoodchile.cl o llama al +56 9 XXXX XXXX.');
    })
    .finally(function(){busy=false;snd.disabled=!inp.value.trim();});
  }
})();
</script>
