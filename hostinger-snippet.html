<!-- BestFood Chile - Asistente IA - Pegar antes de </body> -->
<script>
(function(){
  var KEY = 'TU_API_KEY_AQUI';
  var MODEL = 'claude-haiku-4-5-20251001';
  var SYS = 'Eres el asistente virtual de BestFood Chile, empresa chilena especializada en distribución y venta de alimentos premium para restaurantes, hoteles, casinos, empresas de catering y hogares.\n\nPRODUCTOS: carnes premium nacionales e importadas, mariscos frescos y congelados, frutas y verduras seleccionadas, lácteos, productos gourmet importados, congelados de calidad.\n\nSERVICIOS: despacho a domicilio y a local comercial, pedidos programados (semanal/mensual), asesoría en selección de productos, precios por volumen para empresas, facturación para empresas.\n\nCONTACTO: ventas@bestfoodchile.cl | +56 9 7578 8401\nHORARIO: Lunes a Viernes 8:00–18:00, Sábado 9:00–13:00\nCOBERTURA: Santiago y regiones (confirmar disponibilidad)\nPAGO: transferencia, tarjeta crédito/débito, factura para empresas\n\nOBJETIVO: responder dudas, mostrar el valor de BestFood y capturar datos del lead (nombre, teléfono o email) cuando haya interés de compra. Cuando captures datos, agradece y dile que un ejecutivo lo contactará pronto.\n\nTONO: amable, cercano, profesional, español chileno natural. Respuestas cortas (máx 3–4 oraciones). Si no sabes el precio exacto, ofrece conectar al visitante con el equipo de ventas. Nunca inventes información.';

  /* ── Helpers ── */
  function el(tag, styles, attrs) {
    var e = document.createElement(tag);
    if (styles) e.setAttribute('style', styles);
    if (attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
    return e;
  }
  function txt(parent, t) { parent.appendChild(document.createTextNode(t)); return parent; }

  /* ── Keyframe animation (solo esto en un <style>) ── */
  var sty = document.createElement('style');
  sty.textContent = '@keyframes bfBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}';
  document.head.appendChild(sty);

  /* ══════════════════════════════════════════════════════
     BOTON FLOTANTE
     ══════════════════════════════════════════════════════ */
  var fab = el('div', 'all:initial;position:fixed;bottom:24px;right:24px;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#e8231a,#9b1a13);cursor:pointer;box-shadow:0 4px 22px rgba(232,35,26,.5);display:flex;align-items:center;justify-content:center;z-index:2147483646;transition:transform .2s;');
  fab.innerHTML = '<svg style="width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  var dot = el('div', 'all:initial;position:absolute;top:-2px;right:-2px;width:20px;height:20px;background:#fff;border-radius:50%;border:2px solid #e8231a;color:#e8231a;font-size:11px;font-weight:700;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;');
  txt(dot, '1');
  fab.appendChild(dot);
  document.body.appendChild(fab);

  /* ══════════════════════════════════════════════════════
     VENTANA DEL CHAT (estilo WhatsApp grande)
     ══════════════════════════════════════════════════════ */
  var box = el('div', 'all:initial;position:fixed;bottom:90px;right:24px;width:440px;height:960px;max-height:calc(100vh - 100px);background:#fff;border-radius:20px;box-shadow:0 14px 50px rgba(0,0,0,.28);display:none;flex-direction:column;z-index:2147483647;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;');
  document.body.appendChild(box);

  /* ── Header ── */
  var header = el('div', 'all:initial;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#e8231a,#9b1a13);padding:16px 18px;flex-shrink:0;font-family:inherit;');
  var avatar = el('div', 'all:initial;width:44px;height:44px;min-width:44px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;');
  avatar.innerHTML = '&#x1F356;';
  header.appendChild(avatar);

  var hInfo = el('div', 'all:initial;display:flex;flex-direction:column;gap:2px;flex:1;');
  var hTitle = el('div', 'all:initial;color:#fff;font-size:16px;font-weight:700;font-family:inherit;');
  txt(hTitle, 'BestFood Asistente');
  var hSub = el('div', 'all:initial;color:rgba(255,255,255,.85);font-size:12px;font-family:inherit;display:flex;align-items:center;gap:5px;');
  var greenDot = el('span', 'all:initial;display:inline-block;width:8px;height:8px;background:#4ade80;border-radius:50%;');
  hSub.appendChild(greenDot);
  txt(hSub, ' En linea ahora');
  hInfo.appendChild(hTitle);
  hInfo.appendChild(hSub);
  header.appendChild(hInfo);

  var closeBtn = el('div', 'all:initial;color:#fff;font-size:26px;cursor:pointer;font-family:Arial,sans-serif;padding:4px 8px;line-height:1;opacity:.85;');
  closeBtn.innerHTML = '&times;';
  header.appendChild(closeBtn);
  box.appendChild(header);

  /* ── Messages area ── */
  var msgs = el('div', 'all:initial;flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#f0f2f5;scroll-behavior:smooth;');
  box.appendChild(msgs);

  /* ── Chips ── */
  var chipsDiv = el('div', 'all:initial;display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:#fff;border-top:1px solid #e5e7eb;flex-shrink:0;');
  var chipTexts = [
    ['¿Qué productos venden?', '¿Qué productos tienen?'],
    ['¿Hacen despacho a domicilio?', 'Despacho a domicilio?'],
    ['Quiero solicitar una cotización', 'Pedir cotización'],
    ['¿Cuál es el precio?', 'Precios']
  ];
  chipTexts.forEach(function(c) {
    var chip = el('div', 'all:initial;display:inline-block;background:#fff;border:1px solid #e2e8f0;color:#e8231a;font-size:13px;font-family:inherit;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;');
    txt(chip, c[1]);
    chip.onmouseover = function(){ chip.style.background='#e8231a'; chip.style.color='#fff'; chip.style.borderColor='#e8231a'; };
    chip.onmouseout = function(){ chip.style.background='#fff'; chip.style.color='#e8231a'; chip.style.borderColor='#e2e8f0'; };
    chip.onclick = function(){ go(c[0]); chipsDiv.style.display='none'; };
    chipsDiv.appendChild(chip);
  });
  box.appendChild(chipsDiv);

  /* ── Input area ── */
  var form = el('div', 'all:initial;display:flex;gap:8px;align-items:flex-end;padding:12px 14px;background:#fff;border-top:1px solid #e5e7eb;flex-shrink:0;');
  var inp = el('textarea', 'all:initial;flex:1;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px 14px;font-size:15px;font-family:inherit;resize:none;outline:none;max-height:100px;overflow-y:auto;background:#fff;color:#1e293b;line-height:1.4;min-height:42px;', {placeholder:'Escribe tu pregunta...', rows:'1'});
  var sendBtn = el('div', 'all:initial;width:42px;height:42px;min-width:42px;border-radius:50%;background:linear-gradient(135deg,#e8231a,#9b1a13);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.45;flex-shrink:0;');
  sendBtn.innerHTML = '<svg style="width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
  form.appendChild(inp);
  form.appendChild(sendBtn);
  box.appendChild(form);

  /* ── Footer ── */
  var foot = el('div', 'all:initial;text-align:center;font-size:10px;color:#cbd5e1;padding:6px;background:#fff;flex-shrink:0;font-family:inherit;display:block;');
  txt(foot, 'Asistente IA · BestFood Chile');
  box.appendChild(foot);

  /* ══════════════════════════════════════════════════════
     LOGICA
     ══════════════════════════════════════════════════════ */
  var hist = [], isOpen = false, busy = false, started = false, canSend = false;

  fab.onclick = function() {
    isOpen = !isOpen;
    box.style.display = isOpen ? 'flex' : 'none';
    dot.style.display = 'none';
    if (isOpen && !started) {
      started = true;
      addMsg('bot', '¡Hola! Bienvenido/a a BestFood Chile. Soy tu asistente virtual. ¿En qué puedo ayudarte hoy? Puedo contarte sobre nuestros productos, precios, despachos o conectarte con el equipo de ventas.');
    }
    if (isOpen) inp.focus();
  };

  closeBtn.onclick = function() {
    isOpen = false;
    box.style.display = 'none';
  };

  inp.addEventListener('input', function() {
    canSend = !!inp.value.trim();
    sendBtn.style.opacity = canSend ? '1' : '.45';
    sendBtn.style.cursor = canSend ? 'pointer' : 'default';
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
  });

  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); trigger(); }
  });

  sendBtn.onclick = trigger;

  function trigger() {
    var t = inp.value.trim();
    if (!t || busy) return;
    go(t);
    inp.value = '';
    inp.style.height = 'auto';
    canSend = false;
    sendBtn.style.opacity = '.45';
  }

  function addMsg(role, text) {
    var bubble = el('div',
      role === 'bot'
        ? 'all:initial;display:block;max-width:85%;padding:12px 16px;border-radius:18px;border-bottom-left-radius:4px;background:#fff;color:#111827;font-size:15px;line-height:1.55;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;word-wrap:break-word;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08);'
        : 'all:initial;display:block;max-width:85%;padding:12px 16px;border-radius:18px;border-bottom-right-radius:4px;background:linear-gradient(135deg,#e8231a,#c0190f);color:#fff;font-size:15px;line-height:1.55;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;word-wrap:break-word;align-self:flex-end;box-shadow:0 1px 2px rgba(0,0,0,.1);'
    );
    txt(bubble, text);
    msgs.appendChild(bubble);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    var t = el('div', 'all:initial;display:flex;align-items:center;gap:5px;padding:12px 16px;background:#fff;border-radius:18px;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08);');
    t.id = 'bf-typing';
    for (var i = 0; i < 3; i++) {
      var d = el('span', 'all:initial;display:inline-block;width:8px;height:8px;background:#94a3b8;border-radius:50%;animation:bfBounce 1.1s infinite;animation-delay:' + (i * 0.18) + 's;');
      t.appendChild(d);
    }
    msgs.appendChild(t);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    var t = document.getElementById('bf-typing');
    if (t) t.remove();
  }

  function go(text) {
    if (busy) return;
    addMsg('usr', text);
    hist.push({role: 'user', content: text});
    busy = true;
    sendBtn.style.opacity = '.45';
    showTyping();

    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({model: MODEL, max_tokens: 400, system: SYS, messages: hist.slice(-16)})
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      hideTyping();
      if (data.error) {
        addMsg('bot', 'Error: ' + data.error.message + '. Escríbenos a ventas@bestfoodchile.cl');
        return;
      }
      var reply = (data.content && data.content[0] && data.content[0].text) || 'Hubo un problema. Escríbenos a ventas@bestfoodchile.cl';
      addMsg('bot', reply);
      hist.push({role: 'assistant', content: reply});
    })
    .catch(function() {
      hideTyping();
      addMsg('bot', 'No pude conectarme. Escríbenos a ventas@bestfoodchile.cl o llama al +56 9 7578 8401.');
    })
    .finally(function() {
      busy = false;
      sendBtn.style.opacity = canSend ? '1' : '.45';
    });
  }

  /* ── Responsive mobile ── */
  if (window.innerWidth <= 480) {
    box.style.width = 'calc(100vw - 14px)';
    box.style.right = '7px';
    box.style.height = 'calc(100vh - 110px)';
    box.style.bottom = '96px';
    box.style.borderRadius = '16px';
    fab.style.right = '14px';
    fab.style.bottom = '16px';
  }

})();
</script>
