<!-- ============================================================
     BestFood Chile - Asistente IA
     Pegar justo antes de </body> en la configuración de Hostinger
     ============================================================ -->
<style>
/* Reset dentro del chat para evitar que Hostinger pise estilos */
#bf-box *,#bf-box *::before,#bf-box *::after{box-sizing:border-box !important;margin:0 !important;padding:0 !important;border:none !important;outline:none !important;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif !important;line-height:normal !important;text-decoration:none !important;visibility:visible !important;opacity:1 !important;float:none !important;text-transform:none !important;letter-spacing:normal !important}
#bf-btn{position:fixed !important;bottom:24px !important;right:24px !important;width:62px !important;height:62px !important;border-radius:50% !important;background:linear-gradient(135deg,#e8231a,#9b1a13) !important;border:none !important;cursor:pointer !important;box-shadow:0 4px 22px rgba(232,35,26,.45) !important;display:flex !important;align-items:center !important;justify-content:center !important;z-index:99998 !important;transition:transform .2s !important}
#bf-btn:hover{transform:scale(1.09) !important}
#bf-btn svg{width:28px !important;height:28px !important;fill:none !important;stroke:#fff !important;stroke-width:2 !important}
#bf-dot{position:absolute !important;top:0 !important;right:0 !important;width:18px !important;height:18px !important;background:#fff !important;border-radius:50% !important;border:2px solid #e8231a !important;color:#e8231a !important;font-size:10px !important;font-weight:700 !important;display:flex !important;align-items:center !important;justify-content:center !important}
#bf-box{position:fixed !important;bottom:100px !important;right:24px !important;width:420px !important;height:650px !important;max-height:calc(100vh - 120px) !important;background:#fff !important;border-radius:20px !important;box-shadow:0 14px 50px rgba(0,0,0,.25) !important;display:none !important;flex-direction:column !important;z-index:99999 !important;overflow:hidden !important;animation:bfIn .22s ease !important}
#bf-box.on{display:flex !important}
@keyframes bfIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
#bf-box .bfh{background:linear-gradient(135deg,#e8231a,#9b1a13) !important;padding:15px 18px !important;display:flex !important;align-items:center !important;gap:11px !important;flex-shrink:0 !important;min-height:60px !important}
#bf-box .bfav{width:40px !important;height:40px !important;min-width:40px !important;border-radius:50% !important;background:rgba(255,255,255,.18) !important;display:flex !important;align-items:center !important;justify-content:center !important;font-size:20px !important}
#bf-box .bfhi h3{color:#fff !important;font-size:15px !important;font-weight:600 !important;margin:0 !important;padding:0 !important;background:none !important}
#bf-box .bfhi p{color:rgba(255,255,255,.82) !important;font-size:12px !important;margin:0 !important;padding:0 !important;background:none !important}
#bf-box .bfol{display:inline-block !important;width:7px !important;height:7px !important;background:#4ade80 !important;border-radius:50% !important;margin-right:4px !important}
#bf-box .bfcl{margin-left:auto !important;background:none !important;border:none !important;color:#fff !important;font-size:22px !important;cursor:pointer !important;opacity:.8 !important;line-height:1 !important;padding:2px 6px !important}
#bf-box .bfcl:hover{opacity:1 !important}
#bf-msgs{flex:1 !important;min-height:0 !important;overflow-y:auto !important;padding:14px !important;display:flex !important;flex-direction:column !important;gap:9px !important;scroll-behavior:smooth !important;background:#fff !important}
#bf-msgs::-webkit-scrollbar{width:4px}
#bf-msgs::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
#bf-msgs .bfm{max-width:85% !important;padding:12px 15px !important;border-radius:16px !important;font-size:15px !important;line-height:1.6 !important;word-wrap:break-word !important;display:block !important;visibility:visible !important;color:#111827 !important;background:#e8f0fe !important;min-height:auto !important;height:auto !important;overflow:visible !important}
#bf-msgs .bfm.bot{background:#e8f0fe !important;color:#111827 !important;align-self:flex-start !important;border-bottom-left-radius:3px !important;border:1px solid #c7d9fb !important}
#bf-msgs .bfm.usr{background:linear-gradient(135deg,#e8231a,#9b1a13) !important;color:#fff !important;align-self:flex-end !important;border-bottom-right-radius:3px !important;border:none !important}
#bf-msgs .bftyp{display:flex !important;align-items:center !important;gap:4px !important;padding:10px 13px !important;background:#e8f0fe !important;border-radius:16px !important;border-bottom-left-radius:3px !important;align-self:flex-start !important}
#bf-msgs .bftyp span{width:7px !important;height:7px !important;background:#94a3b8 !important;border-radius:50% !important;animation:bfbounce 1.1s infinite !important;display:inline-block !important}
#bf-msgs .bftyp span:nth-child(2){animation-delay:.18s}
#bf-msgs .bftyp span:nth-child(3){animation-delay:.36s}
@keyframes bfbounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
#bf-chips{padding:8px 11px !important;display:flex !important;flex-wrap:wrap !important;gap:5px !important;border-top:1px solid #f1f5f9 !important;flex-shrink:0 !important;background:#fff !important}
#bf-chips .bfchip{background:#fff !important;border:1px solid #e2e8f0 !important;color:#e8231a !important;font-size:12px !important;padding:5px 10px !important;border-radius:20px !important;cursor:pointer !important;transition:all .15s !important;white-space:nowrap !important}
#bf-chips .bfchip:hover{background:#e8231a !important;color:#fff !important;border-color:#e8231a !important}
#bf-form{padding:11px 13px !important;border-top:1px solid #f1f5f9 !important;display:flex !important;gap:8px !important;align-items:flex-end !important;flex-shrink:0 !important;background:#fff !important}
#bf-inp{flex:1 !important;border:1.5px solid #e2e8f0 !important;border-radius:11px !important;padding:9px 13px !important;font-size:14px !important;resize:none !important;outline:none !important;max-height:90px !important;overflow-y:auto !important;transition:border-color .2s !important;background:#fff !important;color:#1e293b !important;width:auto !important}
#bf-inp:focus{border-color:#e8231a !important}
#bf-snd{width:38px !important;height:38px !important;min-width:38px !important;border-radius:50% !important;background:linear-gradient(135deg,#e8231a,#9b1a13) !important;color:#fff !important;border:none !important;cursor:pointer !important;display:flex !important;align-items:center !important;justify-content:center !important;flex-shrink:0 !important;transition:opacity .2s !important}
#bf-snd:disabled{opacity:.45 !important;cursor:not-allowed !important}
#bf-snd svg{width:16px !important;height:16px !important;fill:none !important;stroke:#fff !important;stroke-width:2.2 !important}
#bf-box .bfft{text-align:center !important;font-size:10px !important;color:#cbd5e1 !important;padding:5px !important;flex-shrink:0 !important;background:#fff !important}
@media(max-width:480px){#bf-box{width:calc(100vw - 14px) !important;right:7px !important;height:calc(100vh - 100px) !important}#bf-btn{right:12px !important;bottom:12px !important}}
</style>

<button id="bf-btn" title="Habla con nosotros">
  <div id="bf-dot">1</div>
  <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>

<div id="bf-box">
  <div class="bfh">
    <div class="bfav">🍖</div>
    <div class="bfhi"><h3>BestFood Asistente</h3><p><span class="bfol"></span>En línea ahora</p></div>
    <button class="bfcl" id="bf-cl">&times;</button>
  </div>
  <div id="bf-msgs"></div>
  <div id="bf-chips">
    <button class="bfchip" data-q="¿Qué productos venden?">¿Qué productos tienen?</button>
    <button class="bfchip" data-q="¿Hacen despacho a domicilio?">¿Despacho a domicilio?</button>
    <button class="bfchip" data-q="Quiero solicitar una cotización">Pedir cotización</button>
    <button class="bfchip" data-q="¿Cuál es el precio?">Precios</button>
  </div>
  <div id="bf-form">
    <textarea id="bf-inp" placeholder="Escribe tu pregunta..." rows="1"></textarea>
    <button id="bf-snd" disabled>
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="bfft">Asistente IA · BestFood Chile</div>
</div>

<script>
(function(){
  var KEY   = 'TU_API_KEY_AQUI'; // ← Reemplaza con tu API Key de Anthropic
  var MODEL = 'claude-haiku-4-5-20251001';
  var SYS   = 'Eres el asistente virtual de BestFood Chile, empresa chilena especializada en distribución y venta de alimentos premium para restaurantes, hoteles, casinos, empresas de catering y hogares.\n\nPRODUCTOS: carnes premium nacionales e importadas, mariscos frescos y congelados, frutas y verduras seleccionadas, lácteos, productos gourmet importados, congelados de calidad.\n\nSERVICIOS: despacho a domicilio y a local comercial, pedidos programados (semanal/mensual), asesoría en selección de productos, precios por volumen para empresas, facturación para empresas.\n\nCONTACTO: ventas@bestfoodchile.cl | +56 9 XXXX XXXX\nHORARIO: Lunes a Viernes 8:00–18:00, Sábado 9:00–13:00\nCOBERTURA: Santiago y regiones (confirmar disponibilidad)\nPAGO: transferencia, tarjeta crédito/débito, factura para empresas\n\nOBJETIVO: responder dudas, mostrar el valor de BestFood y capturar datos del lead (nombre, teléfono o email) cuando haya interés de compra. Cuando captures datos, agradece y dile que un ejecutivo lo contactará pronto.\n\nTONO: amable, cercano, profesional, español chileno natural. Respuestas cortas (máx 3–4 oraciones). Si no sabes el precio exacto, ofrece conectar al visitante con el equipo de ventas. Nunca inventes información.';

  console.log('[BF Chat] Iniciando asistente...');

  var btn   = document.getElementById('bf-btn');
  var box   = document.getElementById('bf-box');
  var cl    = document.getElementById('bf-cl');
  var msgs  = document.getElementById('bf-msgs');
  var inp   = document.getElementById('bf-inp');
  var snd   = document.getElementById('bf-snd');
  var dot   = document.getElementById('bf-dot');
  var chips = document.getElementById('bf-chips');

  // Verificar que los elementos existen
  if(!btn||!box||!msgs||!inp||!snd){
    console.error('[BF Chat] ERROR: No se encontraron los elementos del chat en el DOM');
    return;
  }
  console.log('[BF Chat] Elementos del DOM encontrados OK');

  // Verificar API key
  if(KEY==='TU_API_KEY_AQUI'){
    console.warn('[BF Chat] ADVERTENCIA: No se ha configurado la API Key. Reemplaza TU_API_KEY_AQUI');
  }

  var hist=[], open=false, busy=false, started=false;

  btn.onclick = function(){
    open=!open;
    box.classList.toggle('on',open);
    dot.style.display='none';
    if(open&&!started){
      started=true;
      console.log('[BF Chat] Chat abierto, mostrando bienvenida');
      addMsg('bot','¡Hola! Bienvenido/a a BestFood Chile 👋 Soy tu asistente virtual. ¿En qué puedo ayudarte hoy? Puedo contarte sobre nuestros productos, precios, despachos o conectarte con el equipo de ventas.');
    }
    if(open) inp.focus();
  };
  cl.onclick = function(){open=false;box.classList.remove('on');};

  chips.querySelectorAll('.bfchip').forEach(function(c){
    c.onclick=function(){go(c.dataset.q);chips.style.display='none';};
  });

  inp.oninput=function(){
    snd.disabled=!inp.value.trim();
    inp.style.height='auto';
    inp.style.height=Math.min(inp.scrollHeight,90)+'px';
  };
  inp.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();trigger();}};
  snd.onclick=trigger;

  function trigger(){var t=inp.value.trim();if(!t||busy)return;go(t);inp.value='';inp.style.height='auto';snd.disabled=true;}

  function addMsg(r,t){
    var d=document.createElement('div');
    d.className='bfm '+r;
    d.textContent=t;
    d.style.cssText='display:block !important;visibility:visible !important;opacity:1 !important;min-height:20px !important;overflow:visible !important;';
    if(r==='bot'){
      d.style.cssText+='background:#e8f0fe !important;color:#111827 !important;padding:12px 15px !important;border-radius:16px !important;font-size:15px !important;line-height:1.6 !important;border:1px solid #c7d9fb !important;max-width:85% !important;align-self:flex-start !important;word-wrap:break-word !important;';
    } else {
      d.style.cssText+='background:linear-gradient(135deg,#e8231a,#9b1a13) !important;color:#fff !important;padding:12px 15px !important;border-radius:16px !important;font-size:15px !important;line-height:1.6 !important;max-width:85% !important;align-self:flex-end !important;word-wrap:break-word !important;';
    }
    msgs.appendChild(d);
    msgs.scrollTop=msgs.scrollHeight;
    console.log('[BF Chat] Mensaje agregado ('+r+'): '+t.substring(0,50)+'...');
  }

  function showTyp(){var d=document.createElement('div');d.className='bftyp';d.id='bft';d.innerHTML='<span></span><span></span><span></span>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
  function hideTyp(){var d=document.getElementById('bft');if(d)d.remove();}

  function go(text){
    if(busy)return;
    console.log('[BF Chat] Enviando mensaje: '+text);
    addMsg('usr',text);
    hist.push({role:'user',content:text});
    busy=true;snd.disabled=true;showTyp();

    if(KEY==='TU_API_KEY_AQUI'){
      hideTyp();
      addMsg('bot','⚠️ Error de configuración: La API Key no ha sido configurada. Contacta al administrador del sitio.');
      busy=false;
      console.error('[BF Chat] API Key no configurada');
      return;
    }

    console.log('[BF Chat] Llamando API de Anthropic...');
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:MODEL,
        max_tokens:400,
        system:SYS,
        messages:hist.slice(-16)
      })
    })
    .then(function(r){
      console.log('[BF Chat] Respuesta HTTP status: '+r.status);
      return r.json();
    })
    .then(function(d){
      hideTyp();
      console.log('[BF Chat] Respuesta API:', JSON.stringify(d).substring(0,200));
      // Manejar errores de la API
      if(d.error){
        console.error('[BF Chat] Error API: '+d.error.type+' - '+d.error.message);
        addMsg('bot','Hubo un problema técnico. Escríbenos a ventas@bestfoodchile.cl o llama al +56 9 7578 8401.');
        return;
      }
      var reply=(d.content&&d.content[0]&&d.content[0].text)||'Hubo un problema. Escríbenos a ventas@bestfoodchile.cl';
      addMsg('bot',reply);
      hist.push({role:'assistant',content:reply});
    })
    .catch(function(err){
      hideTyp();
      console.error('[BF Chat] Error de conexión:', err);
      addMsg('bot','Tuve un problema al conectarme. Escríbenos a ventas@bestfoodchile.cl o llama al +56 9 7578 8401.');
    })
    .finally(function(){busy=false;snd.disabled=!inp.value.trim();});
  }

  console.log('[BF Chat] Asistente listo ✓');
})();
</script>
