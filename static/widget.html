<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BestFood Chile - Asistente IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
    }

    /* ── Botón flotante ── */
    #bf-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8231a, #c0392b);
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(232,35,26,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #bf-toggle:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(232,35,26,0.5); }
    #bf-toggle svg { width: 28px; height: 28px; }

    /* Badge de notificación */
    #bf-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      color: #e8231a;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #e8231a;
    }

    /* ── Ventana del chat ── */
    #bf-chat {
      position: fixed;
      bottom: 96px;
      right: 24px;
      width: 370px;
      max-height: 560px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 48px rgba(0,0,0,0.18);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 9999;
      animation: slideUp 0.25s ease;
    }
    #bf-chat.open { display: flex; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .bf-header {
      background: linear-gradient(135deg, #e8231a, #c0392b);
      color: #fff;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .bf-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .bf-header-info h3 { font-size: 15px; font-weight: 600; }
    .bf-header-info p  { font-size: 12px; opacity: 0.85; }
    .bf-online {
      display: inline-block;
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      margin-right: 4px;
    }
    .bf-close {
      margin-left: auto;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      opacity: 0.8;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
    }
    .bf-close:hover { opacity: 1; }

    /* Mensajes */
    #bf-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    #bf-messages::-webkit-scrollbar { width: 4px; }
    #bf-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    .bf-msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .bf-msg.bot {
      background: #f1f5f9;
      color: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .bf-msg.user {
      background: linear-gradient(135deg, #e8231a, #c0392b);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .bf-msg-time {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .bf-msg.user + .bf-msg-time { text-align: right; }

    /* Typing indicator */
    .bf-typing {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: #f1f5f9;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      width: fit-content;
    }
    .bf-typing span {
      width: 7px; height: 7px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .bf-typing span:nth-child(2) { animation-delay: 0.2s; }
    .bf-typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* Sugerencias rápidas */
    #bf-suggestions {
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-top: 1px solid #f1f5f9;
    }
    .bf-chip {
      background: #fff;
      border: 1px solid #e2e8f0;
      color: #e8231a;
      font-size: 12px;
      padding: 5px 11px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .bf-chip:hover { background: #e8231a; color: #fff; border-color: #e8231a; }

    /* Input */
    #bf-input-area {
      padding: 12px 14px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #bf-input {
      flex: 1;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 100px;
      overflow-y: auto;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    #bf-input:focus { border-color: #e8231a; }
    #bf-send {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8231a, #c0392b);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    #bf-send:disabled { opacity: 0.5; cursor: not-allowed; }
    #bf-send svg { width: 18px; height: 18px; }

    /* Footer */
    .bf-footer {
      text-align: center;
      font-size: 10px;
      color: #cbd5e1;
      padding: 6px;
      flex-shrink: 0;
    }

    /* Responsive móvil */
    @media (max-width: 420px) {
      #bf-chat { width: calc(100vw - 16px); right: 8px; bottom: 80px; }
      #bf-toggle { right: 12px; bottom: 12px; }
    }
  </style>
</head>
<body>

<!-- Botón flotante -->
<button id="bf-toggle" title="Chatea con nosotros">
  <div id="bf-badge">1</div>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
</button>

<!-- Ventana de chat -->
<div id="bf-chat">
  <!-- Header -->
  <div class="bf-header">
    <div class="bf-avatar">🍖</div>
    <div class="bf-header-info">
      <h3>BestFood Asistente</h3>
      <p><span class="bf-online"></span>En línea ahora</p>
    </div>
    <button class="bf-close" id="bf-close-btn">&times;</button>
  </div>

  <!-- Mensajes -->
  <div id="bf-messages"></div>

  <!-- Sugerencias rápidas -->
  <div id="bf-suggestions">
    <button class="bf-chip" data-msg="¿Qué productos venden?">¿Qué productos tienen?</button>
    <button class="bf-chip" data-msg="¿Hacen despacho a domicilio?">¿Despachan a domicilio?</button>
    <button class="bf-chip" data-msg="Quiero solicitar una cotización">Solicitar cotización</button>
    <button class="bf-chip" data-msg="¿Cuáles son sus precios?">Precios</button>
  </div>

  <!-- Input -->
  <div id="bf-input-area">
    <textarea id="bf-input" placeholder="Escribe tu pregunta..." rows="1"></textarea>
    <button id="bf-send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <div class="bf-footer">Powered by BestFood Chile IA · Claude AI</div>
</div>

<script>
(function () {
  // ── Configuración ──────────────────────────────────────────
  const API_URL = window.BESTFOOD_API_URL || '/api/chat';
  const WELCOME_MSG = '¡Hola! Bienvenido/a a BestFood Chile 👋 Soy tu asistente virtual. ¿En qué puedo ayudarte hoy? Puedo contarte sobre nuestros productos, precios, despachos o conectarte con nuestro equipo de ventas.';
  // ──────────────────────────────────────────────────────────

  const toggleBtn  = document.getElementById('bf-toggle');
  const chatBox    = document.getElementById('bf-chat');
  const closeBtn   = document.getElementById('bf-close-btn');
  const messagesEl = document.getElementById('bf-messages');
  const inputEl    = document.getElementById('bf-input');
  const sendBtn    = document.getElementById('bf-send');
  const badge      = document.getElementById('bf-badge');
  const suggestions= document.getElementById('bf-suggestions');

  let history = [];
  let isOpen  = false;
  let isTyping= false;
  let initialized = false;

  // ── Toggle chat ───────────────────────────────────────────
  toggleBtn.addEventListener('click', () => {
    isOpen = !isOpen;
    chatBox.classList.toggle('open', isOpen);
    badge.style.display = 'none';
    if (isOpen && !initialized) {
      initialized = true;
      addMessage('bot', WELCOME_MSG);
    }
    if (isOpen) inputEl.focus();
  });

  closeBtn.addEventListener('click', () => {
    isOpen = false;
    chatBox.classList.remove('open');
  });

  // ── Sugerencias rápidas ───────────────────────────────────
  suggestions.querySelectorAll('.bf-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const msg = chip.dataset.msg;
      sendMessage(msg);
      suggestions.style.display = 'none';
    });
  });

  // ── Input ─────────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    sendBtn.disabled = inputEl.value.trim() === '';
    // Auto-resize
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) triggerSend();
    }
  });

  sendBtn.addEventListener('click', triggerSend);

  function triggerSend() {
    const text = inputEl.value.trim();
    if (!text || isTyping) return;
    sendMessage(text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
  }

  // ── Lógica de mensajes ────────────────────────────────────
  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'bf-msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'bf-typing';
    el.id = 'bf-typing-indicator';
    el.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(el);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('bf-typing-indicator');
    if (el) el.remove();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage(text) {
    if (isTyping) return;

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    isTyping = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      if (!res.ok) throw new Error('Error del servidor');

      const data = await res.json();
      removeTyping();
      addMessage('bot', data.reply);
      history.push({ role: 'assistant', content: data.reply });

    } catch (err) {
      removeTyping();
      addMessage('bot', 'Tuve un problema al conectarme. Por favor escríbenos a ventas@bestfoodchile.cl o llama al +56 9 XXXX XXXX.');
    } finally {
      isTyping = false;
      sendBtn.disabled = inputEl.value.trim() === '';
    }
  }

})();
</script>

</body>
</html>
